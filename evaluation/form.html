<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Form</title>
</head>

<body>

    <h2>Donor Information</h2>
    <form>
        <table>
            <tr>
                <td>
                    <label for="donorFirst">First Name</label>
                    <input type="text" id="donorFirst" name="donorFirst" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="donorLast">Last Name</label>
                    <input type="text" id="donorLast" name="donorLast" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="donorCompany">Company</label>
                    <input type="text" id="donorCompany" name="donorCompany" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="donorAddress1">Address 1</label>
                    <input type="text" id="donorAddress1" name="donorAddress1" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="donorAddress2">Address 2</label>
                    <input type="text" id="donorAddress2" name="donorAddress2" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="donorCity">City</label>
                    <input type="text" id="donorCity" name="donorCity" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="donorState">State</label>

                    <select name="donorState" id="donorState">
                        <option value="">Select a state</option>
                        <option value="Dhaka">Dhaka</option>
                        <option value="Rangpur">Rangpur</option>
                        <option value="Barisal">Barisal</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="donorZip">Zipcode</label>
                    <input type="number" id="donorZip" name="donorZip" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="donorCountry">Country</label>

                    <select name="donorCountry" id="donorCountry">
                        <option value="">Select a country</option>
                        <option value="Bangladesh">Bangladesh</option>
                        <option value="India">India</option>
                        <option value="UK">UK</option>
                        <option value="USA">USA</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="donorPhone">Phone</label>
                    <input type="tel" id="donorPhone" name="donorPhone" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="donorFax">Fax</label>
                    <input type="tel" id="donorFax" name="donorFax" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="donorEmail">Email</label>
                    <input type="email" id="donorEmail" name="donorEmail" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="donationAmount">Donation Amount <br> (check a button or type in your amount)</label>
                    <input type="radio" name="donationAmount" value="None">None
                    <input type="radio" name="donationAmount" value="50">$50
                    <input type="radio" name="donationAmount" value="75">$75
                    <input type="radio" name="donationAmount" value="100">$100
                    <input type="radio" name="donationAmount" value="250">$250
                    <input type="radio" name="donationAmount" value="Other">Other
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="otherAmount">other amount $</label>
                    <input type="number" id="otherAmount">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="recurring">Recurring Donation</label>
                    <input type="checkbox" value="recurring">I am interested in giving on a regular basis. <br>

                </td>

            </tr>

            <tr>
                <td>

                </td>
                <td>
                    Monthly Credit Card $ <input type="number"> For <input type="number">Months
                </td>
            </tr>

            <h2>Honorarium and Memorial Donation Information</h2>
            <tr>
                <td>
                    <label for="honorarium">I would like to make this <br> donation </label>
                    <input type="radio" name="honorarium" value="honor">To Honor
                    <input type="radio" name="honorarium" value="honor">In Memory of

                </td>
            </tr>

            <tr>
                <td>
                    <label for="name2">name</label>
                    <input type="text" id="name2">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="address">address</label>
                    <input type="text" id="address" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="city2">city</label>
                    <input type="text" id="city2">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="state2">state</label>

                    <select name="state2" id="state2">
                        <option>Select a state</option>
                        <option>Dhaka</option>
                        <option>Rangpur</option>
                        <option>Barisal</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="zip2">zip</label>
                    <input type="number" id="zip2">
                </td>
            </tr>



        </table>
    </form>

</body>

</html>
